<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introdução ao JavaScript</title>
</head>
<body>
    <h1>Introdução ao JavaScript</h1>
    <p>Eu sou...</p>
</body>

<!-- JAVASCRIPT INTERNO -->
<script>
// Aqui irá o código JavaScript (comentário em linha)
/* Comentário em bloco */

//  DECLARANDO VARIÁVEIS
// VAR
    var nome = "Anne";
    document.write(nome);
    document.write('<br>');
    nome = "Italo";
    document.write(nome);

// LET
    let cidade = "Registro";
//  let cidade = "Pariquera"; => Não é possível
    cidade = "São Paulo";
    document.write('<br>');
    document.write("Eu moro em "+ cidade + '<br>');

// CONST
    const idade = 16;
    // idade = 17; => Não é possível
    document.write("Tenho " + idade + " anos!");
    // const idade = 18; => Não é possível

</script>
</html>
